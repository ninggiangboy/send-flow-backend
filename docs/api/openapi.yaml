    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message]

    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
      required: [error, meta]

    Envelope:
      type: object
      additionalProperties: false
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
      required: [data, meta]

    Auditable:
      type: object
      additionalProperties: false
      properties:
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthProviderResponse:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
        type:
          type: string
        display_name:
          type: string
        enabled:
          type: boolean
      required: [provider, type, display_name, enabled]

    AuthUserResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        mfa_enabled:
          type: boolean
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
      required: [id, email, email_verified, mfa_enabled]

    SessionResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        ip_address:
          type: string
          nullable: true
        auth_method:
          type: string
      required: [id, expires_at]

    AuthSessionResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/AuthUserResponse'
        session:
          $ref: '#/components/schemas/SessionResponse'
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
      required: [user, session, access_token, token_type, expires_at]

    AuthMFALoginChallengeResponse:
      type: object
      additionalProperties: false
      properties:
        mfa_required:
          type: boolean
        mfa_challenge_token:
          type: string
        user:
          $ref: '#/components/schemas/AuthUserResponse'
      required: [mfa_required, mfa_challenge_token, user]

    AuthMeResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        mfa_enabled:
          type: boolean
      required: [id, email, email_verified, mfa_enabled]

    GenericBooleanResponse:
      type: object
      additionalProperties: false
      properties:
        revoked:
          type: boolean
        sent:
          type: boolean
        verified:
          type: boolean
        reset:
          type: boolean
        disabled:
          type: boolean

    MFATOTPSetupResponse:
      type: object
      additionalProperties: false
      properties:
        secret:
          type: string
        otpauth_url:
          type: string
      required: [secret, otpauth_url]

    MFARecoveryCodesResponse:
      type: object
      additionalProperties: false
      properties:
        recovery_codes:
          type: array
          items:
            type: string
      required: [recovery_codes]

    OAuthIdentityProviderResponse:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
        provider_user_id:
          type: string
      required: [provider, provider_user_id]

    OAuthExchangeResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/AuthUserResponse'
        session:
          $ref: '#/components/schemas/SessionResponse'
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        identity_provider:
          $ref: '#/components/schemas/OAuthIdentityProviderResponse'
      required: [user, session, access_token, token_type, expires_at]

    LoginMFARequest:
      type: object
      additionalProperties: false
      properties:
        mfa_challenge_token:
          type: string
        code:
          type: string
        recovery_code:
          type: string
      required: [mfa_challenge_token]

    TokenOnlyRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
      required: [token]

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        new_password:
          type: string
      required: [token, new_password]

    TOTPCodeRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
      required: [code]

    MFADisableRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
        code:
          type: string

    RefreshCookieNote:
      type: object
      description: >
        Refresh token is stored only in the `sf_refresh_token` HttpOnly cookie.
        The implementation ignores refresh tokens sent via body, query, or headers.

    WorkspaceResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        membership_id:
          type: string
        role_names:
          type: array
          items:
            type: string
        plan:
          type: string
          nullable: true
        logo_icon:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, membership_id, role_names, created_at, updated_at]

    MembershipResponse:
      type: object
      additionalProperties: false
      properties:
        membership_id:
          type: string
        workspace_id:
          type: string
        user_email:
          type: string
          format: email
          nullable: true
        status:
          type: string
        role_names:
          type: array
          items:
            type: string
      required: [membership_id, workspace_id, status, role_names]

    InvitationResponse:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        workspace_id:
          type: string
        email:
          type: string
          format: email
        role_ids:
          type: array
          items:
            type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [token, workspace_id, email, role_ids, status, created_at]

    WorkspaceAccessResponse:
      type: object
      additionalProperties: false
      properties:
        workspace_id:
          type: string
        membership_id:
          type: string
        status:
          type: string
        role_ids:
          type: array
          items:
            type: string
        role_names:
          type: array
          items:
            type: string
        effective_permissions:
          type: array
          items:
            type: string
      required:
        [workspace_id, membership_id, status, role_ids, role_names, effective_permissions]

    MembershipRoleAssignmentResponse:
      type: object
      additionalProperties: false
      properties:
        workspace_id:
          type: string
        membership_id:
          type: string
        role_ids:
          type: array
          items:
            type: string
        effective_permissions:
          type: array
          items:
            type: string
      required: [workspace_id, membership_id, role_ids, effective_permissions]

    RoleResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        permissions_mask:
          type: integer
        permission_names:
          type: array
          items:
            type: string
        builtin:
          type: boolean
        status:
          type: string
        version:
          type: integer
      required: [id, name, type, permissions_mask, permission_names, builtin, status, version]

    PermissionResponse:
      type: object
      additionalProperties: false
      properties:
        bit:
          type: integer
        name:
          type: string
      required: [bit, name]

    ApiKeyResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          type: array
          items:
            type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        secret:
          type: string
          nullable: true
      required: [id, name, scope, status]

    SenderDomainRecord:
      type: object
      additionalProperties: false
      properties:
        record_type:
          type: string
        host:
          type: string
        value:
          type: string
      required: [record_type, host, value]

    SenderDomainResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        domain:
          type: string
        status:
          type: string
        desired_records:
          type: array
          items:
            $ref: '#/components/schemas/SenderDomainRecord'
        current_status:
          type: object
          additionalProperties: true
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        failure_reason:
          type: string
          nullable: true
      required: [id, domain, status]

    WebhookConfigResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        target_url:
          type: string
          format: uri
        status:
          type: string
        subscribed_events:
          type: array
          items:
            type: string
        secret:
          type: string
          nullable: true
      required: [id, target_url, status]

    SettingsResponse:
      type: object
      additionalProperties: true
      properties:
        version:
          type: integer
        email_defaults:
          type: object
          additionalProperties: true

    AuditLogEntryResponse:
      type: object
      additionalProperties: false
      properties:
