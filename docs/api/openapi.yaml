openapi: 3.0.3
info:
  title: send-flow API Blueprint
  version: 0.1.0
  description: >
    Contract-first OpenAPI specification derived from docs/api/* only.
    This file documents the product blueprint for send-flow and may include
    endpoints that are not yet implemented in code.
servers:
  - url: /
tags:
  - name: Auth
  - name: Workspaces
  - name: Access
  - name: Sender
  - name: Webhooks
  - name: Settings
  - name: Audience
  - name: Content
  - name: Campaigns
  - name: Delivery
  - name: Operations
  - name: Analytics
  - name: Tracking
  - name: Suppression

security: []

x-implementation-status-values:
  implemented: HTTP route is registered in the backend API server.
  not_implemented: Endpoint is part of the product/API blueprint but is not registered in the backend API server yet.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Bearer token used by dashboard sessions and workspace API keys depending
        on the endpoint. Endpoints that already contain `workspace_id` in the
        path remain stateless by path, and dashboard-session clients should
        provide workspace context explicitly per request when needed.
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: WorkspaceApiKey
      description: Workspace API key sent as a bearer credential, for example `Bearer sk_live_xxx`.
    providerSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: Provider-specific webhook signature header.

  parameters:
    ProviderName:
      name: provider
      in: path
      required: true
      schema:
        type: string
      description: Provider identifier such as `google`, `github`, or an email provider name.
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
      description: Workspace identifier.
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema:
        type: string
    RoleId:
      name: role_id
      in: path
      required: true
      schema:
        type: string
    ApiKeyId:
      name: api_key_id
      in: path
      required: true
      schema:
        type: string
    DomainId:
      name: domain_id
      in: path
      required: true
      schema:
        type: string
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: string
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
    ContactId:
      name: contact_id
      in: path
      required: true
      schema:
        type: string
    ListId:
      name: list_id
      in: path
      required: true
      schema:
        type: string
    SegmentId:
      name: segment_id
      in: path
      required: true
      schema:
        type: string
    AudienceListId:
      name: list_id
      in: query
      required: false
      schema:
        type: string
    AudienceSegmentId:
      name: segment_id
      in: query
      required: false
      schema:
        type: string
    ImportId:
      name: import_id
      in: path
      required: true
      schema:
        type: string
    ExportId:
      name: export_id
      in: path
      required: true
      schema:
        type: string
    SuppressionId:
      name: suppression_id
      in: path
      required: true
      schema:
        type: string
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string
    TrackingId:
      name: tracking_id
      in: path
      required: true
      schema:
        type: string
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Status:
      name: status
      in: query
      required: false
      schema:
        type: string
    Query:
      name: q
      in: query
      required: false
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
    Window:
      name: window
      in: query
      required: false
      schema:
        type: string
    CompareTo:
      name: compare_to
      in: query
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Uniquely identifies a retriable side-effect request. Reusing the same
        key with a different payload should return a conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkspaceContextHeader:
      name: X-Workspace-Id
      in: header
      required: false
      description: >
        Optional workspace context for dashboard-session requests when the
        target workspace is not already part of the path.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Business validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnexpectedError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Meta:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
        next_cursor:
          type: string
        total_estimate:
          type: integer
      required: [request_id]

    ErrorCode:
      type: string
      description: >
        Canonical machine-readable error code returned in `error.code`.
        Each operation returns a subset of these values depending on its auth,
        validation, and business rules.
      enum:
        - analytics.read_denied
        - api_key.config_invalid
        - api_key.invalid
        - api_key.manage_denied
        - api_key.not_found
        - api_key.rotate_conflict
        - api_key.scope_denied
        - api_key.scope_invalid
        - audience.contact_email_conflict
        - audience.contact_not_found
        - audience.contact_payload_invalid
        - audience.contact_status_invalid
        - audience.export_denied
        - audience.export_filter_invalid
        - audience.export_format_invalid
        - audience.export_job_not_found
        - audience.import_denied
        - audience.import_duplicate_submission
        - audience.import_job_not_found
        - audience.import_source_invalid
        - audience.list_membership_payload_invalid
        - audience.list_name_conflict
        - audience.list_not_found
        - audience.read_denied
        - audience.segment_definition_invalid
        - audience.segment_name_conflict
        - audience.segment_not_found
        - audience.write_denied
        - audit.read_denied
        - auth.identity_provider_account_linking_required
        - auth.identity_provider_conflict
        - auth.identity_provider_email_not_verified
        - auth.invalid_credentials
        - auth.mfa_invalid_code
        - auth.mfa_required
        - auth.invalid_request_body
        - auth.invalid_token
        - auth.oauth_state_invalid
        - auth.password_policy_violation
        - auth.provider_not_supported
        - auth.provider_token_exchange_failed
        - auth.rate_limited
        - auth.reset_token_invalid
        - auth.verification_token_invalid
        - campaign.audience_not_ready
        - campaign.invalid_state_transition
        - campaign.not_found
        - campaign.pause_conflict
        - campaign.payload_invalid
        - campaign.read_denied
        - campaign.send_denied
        - campaign.update_payload_invalid
        - campaign.write_denied
        - deliverability.read_denied
        - delivery.cancel_conflict
        - delivery.idempotency_key_conflict
        - delivery.logs_read_denied
        - delivery.message_not_found
        - delivery.recipient_invalid
        - delivery.recipient_suppressed
        - delivery.request_body_invalid
        - delivery.request_rate_limited
        - delivery.retry_conflict
        - delivery.temporarily_unavailable
        - health.runtime_not_ready
        - identity.email_already_registered
        - identity.email_invalid
        - identity.invitation_already_accepted
        - identity.invitation_not_found
        - identity.invitation_payload_invalid
        - identity.invitation_token_expired
        - identity.last_owner_cannot_be_removed
        - identity.membership_manage_denied
        - identity.membership_not_found
        - identity.permission_registry_unknown
        - identity.permission_set_invalid
        - identity.role_assignment_conflict
        - identity.role_manage_denied
        - identity.role_name_conflict
        - identity.role_not_found
        - identity.workspace_access_denied
        - identity.workspace_not_found
        - operations.cancel_manage_denied
        - operations.queue_read_denied
        - operations.retry_manage_denied
        - operations.retry_read_denied
        - rate_limit.read_denied
        - sender.domain_invalid
        - sender.domain_not_found
        - sender.domain_not_verified
        - sender.invalid_state_transition
        - sender.manage_denied
        - sender.provider_config_invalid
        - settings.manage_denied
        - settings.payload_invalid
        - settings.version_conflict
        - suppression.entry_not_found
