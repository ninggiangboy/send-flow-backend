paths:
  /api/v1/auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      x-implementation-status: implemented
      summary: Create a new user account
      description: |
        Public signup endpoint for dashboard users.
        Returns `access_token` in the response body and sets `sf_refresh_token`
        as an HttpOnly cookie scoped to `/api/v1/auth/refresh`.

        Possible error.code values:
        - `auth.invalid_request_body`
        - `identity.email_already_registered`
        - `identity.email_invalid`
        - `auth.password_policy_violation`
        - `auth.rate_limited`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              default:
                value:
                  email: owner@example.com
                  password: StrongPassword123!
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSessionResponse'
                    required: [data]
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      x-implementation-status: implemented
      summary: Log in with email and password
      description: |
        Returns either a full auth session payload or an MFA challenge response.
        Refresh token rotation happens only through the HttpOnly cookie flow.

        Possible error.code values:
        - `auth.invalid_request_body`
        - `auth.invalid_credentials`
        - `auth.rate_limited`
        - `auth.mfa_required`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/AuthSessionResponse'
                          - $ref: '#/components/schemas/AuthMFALoginChallengeResponse'
                    required: [data]
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/providers:
    get:
      tags: [Auth]
      operationId: listAuthProviders
      x-implementation-status: implemented
      summary: List enabled auth providers
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuthProviderResponse'
                    required: [data]

  /api/v1/auth/oauth/{provider}/start:
    post:
      tags: [Auth]
      operationId: startOAuth
      x-implementation-status: implemented
      summary: Start an OAuth or OIDC login flow
      description: |
        Possible error.code values:
        - `auth.invalid_request_body`
        - `auth.provider_not_supported`
        - `health.runtime_not_ready`
      parameters:
        - $ref: '#/components/parameters/ProviderName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthStartRequest'
      responses:
        '200':
          description: Authorization URL and state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
                    required: [data]

  /api/v1/auth/oauth/{provider}/exchange:
    post:
      tags: [Auth]
      operationId: exchangeOAuth
      x-implementation-status: implemented
      summary: Exchange an OAuth code for a session
      description: |
        Exchange accepted. Backend also sets the refresh token as an HttpOnly cookie.

        Possible error.code values:
        - `auth.oauth_state_invalid`
        - `auth.provider_not_supported`
        - `auth.invalid_token`
        - `health.runtime_not_ready`
      parameters:
        - $ref: '#/components/parameters/ProviderName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
      responses:
        '200':
          description: Exchange accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OAuthExchangeResponse'
                    required: [data]

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-implementation-status: implemented
      summary: Revoke the current session
      description: |
        Possible error.code values:
        - `auth.invalid_token`
        Also clears the `sf_refresh_token` HttpOnly cookie.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: me
      x-implementation-status: implemented
      summary: Return the current authenticated identity
      description: |
        Possible error.code values:
        - `auth.invalid_request_body`
        - `auth.invalid_token`
        - `identity.invalid_workspace_name`
        - `identity.workspace_name_conflict`
        - `health.runtime_not_ready`
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current identity snapshot with `email_verified` and `mfa_enabled`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthMeResponse'
                    required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      x-implementation-status: implemented
      summary: List active sessions for the current user
      description: |
        Possible error.code values:
        - `auth.invalid_token`
        - `auth.session_not_owned`
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SessionResponse'
                    required: [data]

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      x-implementation-status: implemented
      summary: Rotate session tokens using the HttpOnly refresh cookie
      description: |
        Reads `sf_refresh_token` only from the HttpOnly cookie. Client-supplied
        body, query, or header refresh tokens are ignored by the implementation.

        Possible error.code values:
        - `auth.invalid_token`
        - `auth.rate_limited`
      responses:
        '200':
          description: New access token and rotated refresh cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSessionResponse'
                    required: [data]

  /api/v1/auth/login/mfa:
    post:
      tags: [Auth]
      operationId: loginMFA
      x-implementation-status: implemented
      summary: Complete login with TOTP or recovery code
      description: |
        Possible error.code values:
        - `auth.invalid_request_body`
        - `auth.invalid_token`
        - `auth.mfa_invalid_code`
        - `auth.rate_limited`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMFARequest'
      responses:
        '200':
          description: MFA login accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSessionResponse'
                    required: [data]

        '401':
          description: Invalid challenge or MFA code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      x-implementation-status: implemented
      summary: Verify email address using a single-use token
      description: |
        Possible error.code values:
        - `auth.invalid_request_body`
        - `auth.verification_token_invalid`
        - `auth.rate_limited`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenOnlyRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        properties:
                          verified:
                            type: boolean
                        required: [verified]
                    required: [data]

  /api/v1/auth/email/verify/request:
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      x-implementation-status: implemented
      summary: Resend a verification email for the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        properties:
                          sent:
                            type: boolean
                        required: [sent]
                    required: [data]

  /api/v1/auth/password/forgot:
