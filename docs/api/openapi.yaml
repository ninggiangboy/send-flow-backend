          type: string
        actor_user_id:
          type: string
        action_type:
          type: string
        target_id:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
        summary:
          type: string
          nullable: true
      required: [id, actor_user_id, action_type, occurred_at]

    ContactResponse:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string

    ListResponse:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        contact_count:
          type: integer
      required: [id, name]

    ListMembershipSummaryResponse:
      type: object
      additionalProperties: false
      properties:
        list_id:
          type: string
        mode:
          type: string
        added_count:
          type: integer
        removed_count:
          type: integer
        skipped_count:
          type: integer
      required: [list_id, mode, added_count, removed_count, skipped_count]

    SegmentDefinition:
      type: object
      additionalProperties: true
      properties:
        rules:
          type: array
          items:
            type: object
            additionalProperties: true

    SegmentResponse:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        definition:
          $ref: '#/components/schemas/SegmentDefinition'
      required: [id, name]

    AudienceJobResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        import_id:
          type: string
        export_id:
          type: string
        status:
          type: string
        progress:
          type: number
        processed_count:
          type: integer
        failed_count:
          type: integer
        error_summary:
          type: string
          nullable: true
        artifact_uri:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true

    TemplateResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        subject:
          type: string
          nullable: true
        html:
          type: string
          nullable: true
