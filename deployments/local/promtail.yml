server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sendflow-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: sendflow-files
          service: api
          __path__: /var/log/sendflow/api.log
      - targets:
          - localhost
        labels:
          job: sendflow-files
          service: api
          __path__: /var/log/sendflow/api-*.log
      - targets:
          - localhost
        labels:
          job: sendflow-files
          service: worker
          __path__: /var/log/sendflow/worker.log
      - targets:
          - localhost
        labels:
          job: sendflow-files
          service: worker
          __path__: /var/log/sendflow/worker-*.log
    pipeline_stages:
      - regex:
          source: filename
          expression: '/var/log/sendflow/(?P<file_service>api|worker)(?:-(?P<file_instance>[0-9]+))?\.log'
      - json:
          expressions:
            level: level
            app: app
            env: env
            log_service: service
            instance_id: instance_id
            msg: msg
      - template:
          source: instance_id
          template: '{{ if .Value }}{{ .Value }}{{ else if .file_instance }}sendflow-{{ .file_service }}-local-{{ .file_instance }}{{ else }}sendflow-{{ .file_service }}-local{{ end }}'
      - template:
          source: level
          template: '{{ if .Value }}{{ .Value }}{{ else }}UNKNOWN{{ end }}'
      - labels:
          instance_id:
          level:
          app:
          env:

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - replacement: docker
        target_label: job
      - source_labels:
          - __meta_docker_container_name
        regex: /(.+)
        target_label: container
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: service
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_project
        target_label: compose_project
