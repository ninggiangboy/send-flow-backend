apiVersion: apps/v1
kind: Deployment
metadata:
  name: send-flow-worker
  namespace: send-flow
  labels:
    app: send-flow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: send-flow-worker
  template:
    metadata:
      labels:
        app: send-flow-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/metrics
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: worker
          image: ghcr.io/replace-owner/send-flow-backend:latest
          imagePullPolicy: Always
          command: ["/app/worker"]
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: APP_NAME
              value: send-flow-worker
            - name: APP_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: SERVICE_NAME
              value: worker
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INSTANCE_ADDR
              value: ":8082"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WORKER_HTTP_ADDR
              value: ":8082"
            - name: WORKER_ENABLED_CONSUMERS
              value: "delivery.queue_campaign_messages,delivery_provider_events,tracking_provider_events,delivery.process_due_messages,analytics_events,notification.identity_events,notification.process_due_retries,webhooks.deliver_events,webhooks.process_due_deliveries,audience.import_processor,audience.export_processor"
            - name: WORKER_CONCURRENCY
              value: "1"
            - name: WORKER_SHUTDOWN_TIMEOUT
              value: "10s"
            - name: WORKER_CONSUMER_GROUP_PREFIX
              value: send-flow
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: DATABASE_URL
            - name: DATABASE_READ_URL
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: DATABASE_READ_URL
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: REDIS_ADDR
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: KAFKA_BROKERS
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: CLICKHOUSE_DSN
            - name: OBJECT_STORAGE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: OBJECT_STORAGE_ENDPOINT
            - name: OBJECT_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: OBJECT_STORAGE_ACCESS_KEY_ID
            - name: OBJECT_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: OBJECT_STORAGE_SECRET_ACCESS_KEY
            - name: OBJECT_STORAGE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: OBJECT_STORAGE_BUCKET
            - name: OBJECT_STORAGE_REGION
              value: "us-east-1"
            - name: OBJECT_STORAGE_FORCE_PATH_STYLE
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: send-flow-worker
  namespace: send-flow
  labels:
    app: send-flow-worker
spec:
  selector:
    app: send-flow-worker
  ports:
    - name: http
      port: 80
      targetPort: 8082
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: send-flow-worker
  namespace: send-flow
  labels:
    app: send-flow-worker
spec:
  selector:
    matchLabels:
      app: send-flow-worker
  namespaceSelector:
    matchNames:
      - send-flow
  endpoints:
    - port: http
      path: /api/metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: send-flow-worker
  namespace: send-flow
  labels:
    app: send-flow-worker
spec:
  selector:
    matchLabels:
      app: send-flow-worker
  namespaceSelector:
    matchNames:
      - send-flow
  podMetricsEndpoints:
    - port: http
      path: /api/metrics
      interval: 15s
