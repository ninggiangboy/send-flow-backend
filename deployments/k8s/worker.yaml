apiVersion: apps/v1
kind: Deployment
metadata:
  name: send-flow-worker
  namespace: send-flow
  labels:
    app: send-flow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: send-flow-worker
  template:
    metadata:
      labels:
        app: send-flow-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/replace-owner/send-flow-backend:latest
          imagePullPolicy: Always
          command: ["/app/worker"]
          ports:
            - containerPort: 8082
          env:
            - name: APP_NAME
              value: send-flow-worker
            - name: APP_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: WORKER_HTTP_ADDR
              value: ":8082"
            - name: WORKER_ENABLED_CONSUMERS
              value: "delivery.queue_campaign_messages,delivery_provider_events,tracking_provider_events,delivery.process_due_messages,analytics_events,notification.identity_events,notification.process_due_retries,webhooks.deliver_events,webhooks.process_due_deliveries"
            - name: WORKER_CONCURRENCY
              value: "1"
            - name: WORKER_SHUTDOWN_TIMEOUT
              value: "10s"
            - name: WORKER_CONSUMER_GROUP_PREFIX
              value: send-flow
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: DATABASE_URL
            - name: DATABASE_READ_URL
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: DATABASE_READ_URL
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: REDIS_ADDR
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: KAFKA_BROKERS
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: CLICKHOUSE_DSN
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: send-flow-worker
  namespace: send-flow
  labels:
    app: send-flow-worker
spec:
  selector:
    app: send-flow-worker
  ports:
    - name: http
      port: 80
      targetPort: 8082
