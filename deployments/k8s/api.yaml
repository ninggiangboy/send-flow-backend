apiVersion: apps/v1
kind: Deployment
metadata:
  name: send-flow-api
  namespace: send-flow
  labels:
    app: send-flow-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: send-flow-api
  template:
    metadata:
      labels:
        app: send-flow-api
    spec:
      containers:
        - name: api
          image: ghcr.io/replace-owner/send-flow-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: APP_NAME
              value: send-flow-api
            - name: APP_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: HTTP_ADDR
              value: ":8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: DATABASE_URL
            - name: DATABASE_READ_URL
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: DATABASE_READ_URL
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: REDIS_ADDR
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: KAFKA_BROKERS
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: CLICKHOUSE_DSN
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: send-flow-api
  namespace: send-flow
  labels:
    app: send-flow-api
spec:
  selector:
    app: send-flow-api
  ports:
    - name: http
      port: 80
      targetPort: 8081
