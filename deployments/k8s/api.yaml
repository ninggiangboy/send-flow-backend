apiVersion: apps/v1
kind: Deployment
metadata:
  name: send-flow-api
  namespace: send-flow
  labels:
    app: send-flow-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: send-flow-api
  template:
    metadata:
      labels:
        app: send-flow-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/metrics
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: api
          image: ghcr.io/replace-owner/send-flow-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: APP_NAME
              value: send-flow-api
            - name: APP_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: SERVICE_NAME
              value: api
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INSTANCE_ADDR
              value: ":8081"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HTTP_ADDR
              value: ":8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: DATABASE_URL
            - name: DATABASE_READ_URL
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: DATABASE_READ_URL
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: REDIS_ADDR
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: KAFKA_BROKERS
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: send-flow-secrets
                  key: CLICKHOUSE_DSN
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: send-flow-api
  namespace: send-flow
  labels:
    app: send-flow-api
spec:
  selector:
    app: send-flow-api
  ports:
    - name: http
      port: 80
      targetPort: 8081
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: send-flow-api
  namespace: send-flow
  labels:
    app: send-flow-api
spec:
  selector:
    matchLabels:
      app: send-flow-api
  namespaceSelector:
    matchNames:
      - send-flow
  endpoints:
    - port: http
      path: /api/metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: send-flow-api
  namespace: send-flow
  labels:
    app: send-flow-api
spec:
  selector:
    matchLabels:
      app: send-flow-api
  namespaceSelector:
    matchNames:
      - send-flow
  podMetricsEndpoints:
    - port: http
      path: /api/metrics
      interval: 15s
